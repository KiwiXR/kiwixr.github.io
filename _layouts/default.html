<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    {% include webpack-scripts.html %}
    <title>{{ page.tab_title | default: page.title }}</title>
    <script type="text/javascript">
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],  // Recognize inline math with $...$ or \( ... \)
                displayMath: [['$$', '$$'], ['\\[', '\\]']],  // Recognize block math with $$...$$ or \[ ... \]
            },
            svg: {
                fontCache: 'global',
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" type="text/javascript"></script>
</head>

<body>
    {{ content }}
</body>
</html>
