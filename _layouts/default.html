<!DOCTYPE html>
<html lang="en">
<head>
    {% if site.google_analytics %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    {% include webpack-scripts.html %}
    <title>{{ page.tab_title | default: page.title }}</title>
    <script type="text/javascript">
        window.MathJax = {
            startup: {
                ready() {
                    var CHTMLmath = MathJax._.output.chtml.Wrappers.math.CHTMLmath;
                    CHTMLmath.styles['mjx-container[jax="CHTML"][display="true"]'].margin = '0';
                    CHTMLmath.styles['mjx-container[jax="CHTML"][display="true"]'].padding = '0.5em';
                    MathJax.startup.defaultReady();
                }
            },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$','$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            },
            svg: {
                fontCache: 'global',
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" type="text/javascript"></script>
</head>

<body>
    {{ content }}
</body>
</html>
