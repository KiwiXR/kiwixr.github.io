<!DOCTYPE html>
<html lang="en">
<head>
    {% if site.google_analytics %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    {% include webpack-scripts.html %}
    <title>{{ page.tab_title | default: page.title }}</title>
    <script type="text/javascript">
        window.MathJax = {
            startup: {
                ready() {
                    var CHTMLmath = MathJax._.output.chtml.Wrappers.math.CHTMLmath;
                    CHTMLmath.styles['mjx-container[jax="CHTML"][display="true"]'].margin = '0.5em';
                    MathJax.startup.defaultReady();
                }
            },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],  // Recognize inline math with $...$ or \( ... \)
                displayMath: [['$$', '$$'], ['\\[', '\\]']],  // Recognize block math with $$...$$ or \[ ... \]
            },
            svg: {
                fontCache: 'global',
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" type="text/javascript"></script>
</head>

<body>
    {{ content }}
{% if site.google_analytics %}
<script>
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
    ga('create', '{{ site.google_analytics }}', 'auto');
    ga('send', 'pageview');
</script>
{% endif %}
</body>
</html>
